<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070410">
<meta name="robots" content="noindex, nofollow">
<title>Kompas tela · Hra</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070410;--card:#120a1e;--card2:#1a0e2a;--border:#2a1a44;
  --text:#f0e6ff;--muted:#7a6a9a;
  --accent:#e11d6e;--accent2:#f59e0b;--gold:#ffb800;
  --jade:#10b981;--purple:#a855f7;--red:#ef4444;
  --glow:rgba(225,29,110,.18);
}
html,body{height:100%;overscroll-behavior:none}
body{
  background:#000;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  font-size:15px;
}

/* =========================================================
   LAYOUT — všetko fixed, PDF fullscreen
========================================================= */
.app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
}

/* =========================================================
   GAME VIEW — PDF FULLSCREEN
========================================================= */
#viewGame{
  position:fixed;inset:0;
  display:none;
  flex-direction:column;
  background:#000;
}
#viewGame.active{display:flex}

/* PDF container — scroll, fullscreen pod top a nad bottom overlays */
#pdfContainer{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:#000;
  padding-top:calc(56px + env(safe-area-inset-top,0px));
  padding-bottom:calc(180px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
}
#pdfContainer::-webkit-scrollbar{width:4px}
#pdfContainer::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

#pdfCanvas{
  display:block;
  max-width:100%;
  height:auto;
  box-shadow:0 8px 40px rgba(0,0,0,.9);
}
#pdfLoading{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  color:var(--muted);
  font-size:.8rem;
  text-align:center;
  line-height:1.6;
  padding:20px;
  width:100%;
  max-width:340px;
}
#pdfLoading .spin{
  display:inline-block;width:26px;height:26px;
  border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite;
  margin-bottom:12px;
}
@keyframes spin{to{transform:rotate(360deg)}}
#pdfLoading .err{
  color:var(--red);font-size:.72rem;margin-top:10px;
  line-height:1.6;background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.25);
  padding:10px;border-radius:8px;
  text-align:left;
}
#pdfLoading .err b{color:var(--accent2)}
.fallback-box{margin-top:14px}
.fallback-label{
  display:inline-block;padding:11px 20px;
  background:linear-gradient(135deg,rgba(225,29,110,.2),rgba(168,85,247,.15));
  border:1px solid var(--accent);border-radius:10px;
  color:#fff;font-size:.75rem;font-weight:800;
  letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;
  transition:.2s;
}
.fallback-label:hover{background:rgba(225,29,110,.3);transform:translateY(-1px)}
.fallback-label input{display:none}

/* =========================================================
   TOP OVERLAY — plávajúce nad PDF
========================================================= */
.top-overlay{
  position:absolute;
  top:0;left:0;right:0;
  padding:8px 10px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  background:linear-gradient(180deg,rgba(7,4,16,.9) 0%,rgba(7,4,16,.7) 60%,transparent 100%);
  pointer-events:none;
  z-index:20;
}
.top-overlay > *{pointer-events:auto}
.top-left{
  display:flex;gap:6px;align-items:center;
  min-width:0;flex:1;
}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;
  background:rgba(7,4,16,.75);
  border:1px solid var(--border);
  border-radius:20px;
  font-family:ui-monospace,monospace;
  font-size:.58rem;font-weight:800;
  color:var(--gold);letter-spacing:1px;
  white-space:nowrap;
  backdrop-filter:blur(8px);
}
.pill .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent2);
  box-shadow:0 0 8px var(--accent2);
  animation:lp 1.6s ease-in-out infinite;
}
@keyframes lp{50%{opacity:.3;transform:scale(.7)}}
.pill.mode-pill{color:var(--accent);font-family:inherit;font-size:.55rem;letter-spacing:1.2px;text-transform:uppercase}

.top-right{
  display:flex;gap:6px;align-items:center;
}
.icon-btn{
  width:38px;height:38px;
  border-radius:50%;
  border:1px solid var(--border);
  background:rgba(7,4,16,.8);
  color:var(--text);font-size:1.05rem;
  cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
  font-family:inherit;
  flex-shrink:0;
}
.icon-btn:active{transform:scale(.92);background:rgba(225,29,110,.2)}

/* =========================================================
   BOTTOM OVERLAY — DRAW + turn + mini akcie
========================================================= */
.bottom-overlay{
  position:absolute;
  bottom:0;left:0;right:0;
  padding:14px 12px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,rgba(7,4,16,.96) 0%,rgba(7,4,16,.9) 60%,transparent 100%);
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:20;
  pointer-events:none;
}
.bottom-overlay > *{pointer-events:auto}

.turn-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}
.turn-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 18px;
  border-radius:24px;
  background:linear-gradient(135deg,rgba(225,29,110,.22),rgba(168,85,247,.15));
  border:1px solid var(--accent);
  color:#fff;
  font-size:.78rem;font-weight:900;
  letter-spacing:2px;text-transform:uppercase;
  box-shadow:0 0 20px rgba(225,29,110,.3);
  font-family:inherit;
  cursor:pointer;
  transition:.2s;
}
.turn-pill:active{transform:scale(.96)}
.turn-pill .ico{font-size:.95rem;line-height:1}

/* MEGA DRAW BUTTON */
.draw-mega{
  width:100%;
  padding:20px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#e11d6e 0%,#a855f7 50%,#f59e0b 100%);
  background-size:200% 200%;
  color:#fff;
  font-size:1.15rem;
  font-weight:900;
  letter-spacing:3px;
  text-transform:uppercase;
  cursor:pointer;
  transition:transform .2s;
  box-shadow:0 8px 30px rgba(225,29,110,.5),0 0 60px rgba(225,29,110,.3);
  animation:sg 6s ease infinite;
  font-family:inherit;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.draw-mega::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.2) 50%,transparent 100%);
  transform:translateX(-100%);
  animation:shine 3s ease-in-out infinite;
}
@keyframes shine{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
@keyframes sg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.draw-mega:active{transform:scale(.97)}
.draw-mega:disabled{
  opacity:.4;cursor:not-allowed;
  animation:none;box-shadow:none;
  background:rgba(255,255,255,.1);
}
.draw-mega:disabled::before{display:none}
.draw-mega .ico{font-size:1.4rem;line-height:1}
